name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK + run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu 26 runner images: the SDK location/PATH moved and
      # android-actions/setup-android is unstable there. This step works in
      # both cases — uses the preinstalled SDK when present, otherwise
      # installs the commandline tools, then accepts licenses. AGP then
      # auto-installs whatever platforms/build-tools the build needs.
      - name: Set up Android SDK (preinstalled or self-installed)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools missing — installing…"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "sdkmanager: $($SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --version)"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (gradle :app:assembleDebug)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/build_output.txt

      # Logs are hard to reach from tooling; surface compile errors as
      # check-run annotations (readable via the GitHub API) on failure.
      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error: |Caused by:" /tmp/build_output.txt | head -8 | while IFS= read -r line; do echo "::error::${line:0:280}"; done || true
          grep -A 8 "What went wrong" /tmp/build_output.txt | head -12 | while IFS= read -r line; do echo "::error::${line:0:280}"; done || true

      - name: Run available unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee /tmp/test_output.txt

      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E "^e: |FAILED|> Task .+ FAILED" /tmp/test_output.txt | head -8 | while IFS= read -r line; do echo "::error::${line:0:280}"; done || true
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for node in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (node.get('message') or node.text or '')[:220]
                      print(f"::error::FAILED {case.get('classname')}.{case.get('name')}: {msg}")
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiSpace-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publishes the APK as a release asset so there is a permanent direct
      # download link (no navigation through Actions artifacts needed).
      - name: Publish APK to the 'latest' GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MultiSpace-debug.apk
          gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MultiSpace — latest debug APK" \
              --notes "Automated latest debug build. Direct APK download below. Installed via Android PackageInstaller flow."
          gh release upload latest MultiSpace-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "Direct link: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/MultiSpace-debug.apk"

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MultiSpace-test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: ignore
