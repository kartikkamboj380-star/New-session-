name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK + run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (gradle :app:assembleDebug)
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Run available unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiSpace-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MultiSpace-test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: ignore
