name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK + run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu 26 runner images: the SDK location/PATH moved and
      # android-actions/setup-android is unstable there. This step works in
      # both cases — uses the preinstalled SDK when present, otherwise
      # installs the commandline tools, then accepts licenses. AGP then
      # auto-installs whatever platforms/build-tools the build needs.
      - name: Set up Android SDK (preinstalled or self-installed)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools missing — installing…"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "sdkmanager: $($SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --version)"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (gradle :app:assembleDebug)
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Run available unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiSpace-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MultiSpace-test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: ignore
